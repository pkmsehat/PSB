<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambil Antrian - Puskesmas Sehat Bersama</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0fdf4; color: #1e293b; }
   .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    header { background: white; box-shadow: 0 1px 3px #0001; position: sticky; top: 0; z-index: 9999; }
   .nav { display: flex; justify-content: space-between; align-items: center; height: 70px; }
   .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; color: #047857; text-decoration: none; }
   .logo img { width: 40px; height: 40px; object-fit: contain; }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="Logo Puskesmas Sehat Bersama">
        <div>PUSKESMAS SEHAT BERSAMA</div>
      </a>
      <div class="flex items-center gap-4">
        <span id="namaUser" class="text-sm text-gray-600"></span>
        <button onclick="logout()" class="bg-red-100 text-red-700 px-3 py-1 rounded-lg text-sm font-medium">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <main class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
      <div class="text-center mb-6">
        <i class="fa-solid fa-ticket text-5xl text-teal-600 mb-3"></i>
        <h1 class="text-2xl font-bold text-teal-700">Ambil Nomor Antrian</h1>
        <p class="text-gray-600 text-sm mt-1">Pilih poli tujuan kamu</p>
      </div>

      <form id="antrianForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
          <input type="text" id="nama" readonly class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">NIK</label>
          <input type="text" id="nik" readonly class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">No. HP</label>
          <input type="text" id="hp" readonly class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Poli *</label>
          <select id="poli" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
            <option value="">-- Pilih Poli --</option>
            <option value="Poli Umum">Poli Umum</option>
            <option value="Poli Gigi">Poli Gigi</option>
            <option value="KIA/KB">KIA/KB</option>
            <option value="Laboratorium">Laboratorium</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-hand-pointer"></i> Ambil Antrian Sekarang
        </button>

        <div id="hasilAntrian" class="hidden text-center p-4 bg-teal-50 rounded-lg">
          <p class="text-sm text-gray-600">Nomor Antrian Kamu:</p>
          <p id="nomorAntrian" class="text-4xl font-bold text-teal-700 my-2"></p>
          <p class="text-sm text-gray-600">Estimasi dipanggil: <span id="estimasi" class="font-bold"></span></p>
          <a href="cek.html" class="inline-block mt-3 text-sm bg-white border border-teal-600 text-teal-600 px-4 py-2 rounded-lg">
            Cek Status Antrian
          </a>
        </div>
      </form>
    </div>
  </main>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytiOmk3hIj-hYcNqNg4dUTUk24ZAg-oJlRbyZI_XK8-f1ocHBCtBjTEucyfSLtCNzDAg/exec';

// Cek udah login belum
const user = JSON.parse(localStorage.getItem('userPuskesmas'));
if(!user || user.role!== 'masyarakat') {
  alert('Silakan login dulu sebagai Masyarakat');
  window.location.href = 'login.html';
}

// Isi data otomatis
document.getElementById('namaUser').textContent = 'Halo, ' + user.nama;
document.getElementById('nama').value = user.nama;
document.getElementById('nik').value = user.nik;
document.getElementById('hp').value = user.hp;

function logout() {
  localStorage.removeItem('userPuskesmas');
  window.location.href = 'index.html';
}

document.getElementById('antrianForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengambil...';

  const data = {
    action: 'daftarAntrian',
    nama: user.nama,
    nik: user.nik,
    hp: user.hp,
    poli: document.getElementById('poli').value
  };

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(data)
    });
    const hasil = await res.json();

    if(hasil.status == 'ok') {
      document.getElementById('hasilAntrian').classList.remove('hidden');
      document.getElementById('nomorAntrian').textContent = hasil.nomor;
      document.getElementById('estimasi').textContent = hasil.estimasi;
      btn.style.display = 'none';
    } else {
      alert('Gagal ambil antrian: ' + hasil.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> Ambil Antrian Sekarang';
    }
  } catch (err) {
    alert('Error koneksi ke server');
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> Ambil Antrian Sekarang';
  }
});
</script>
</body>
</html>
