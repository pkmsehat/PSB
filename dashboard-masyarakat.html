<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Masyarakat - Puskesmas Sehat Bersama</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0fdf4; }
   .tab-active { background: #0d9488; color: white; }
    input:disabled { background: #f3f4f6; cursor: not-allowed; }
  </style>
</head>
<body>
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2 font-bold text-teal-700">
        <img src="logo.png" alt="Logo" class="w-10 h-10">
        PUSKESMAS SEHAT BERSAMA
      </a>
      <div class="flex items-center gap-4">
        <span id="namaUser" class="text-sm text-gray-600"></span>
        <button onclick="logout()" class="bg-red-100 text-red-700 px-3 py-1 rounded-lg text-sm font-medium">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6">
    <!-- Tab Menu -->
    <div class="flex gap-2 mb-6 bg-white p-2 rounded-xl shadow">
      <button onclick="showTab('profil')" id="tab-profil" class="flex-1 py-2 rounded-lg font-medium tab-active">
        <i class="fa-solid fa-user"></i> Data Diri
      </button>
      <button onclick="showTab('rekam')" id="tab-rekam" class="flex-1 py-2 rounded-lg font-medium text-gray-600">
        <i class="fa-solid fa-notes-medical"></i> Rekam Medis
      </button>
      <button onclick="showTab('antrian')" id="tab-antrian" class="flex-1 py-2 rounded-lg font-medium text-gray-600">
        <i class="fa-solid fa-ticket"></i> Antrian Online
      </button>
    </div>

    <!-- Tab 1: Data Diri -->
    <div id="content-profil" class="bg-white p-6 rounded-xl shadow">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-teal-700">Data Diri Pasien</h2>
        <button id="btnEdit" onclick="toggleEdit()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
          <i class="fa-solid fa-pen-to-square"></i> Edit Data
        </button>
        <button id="btnBatal" onclick="toggleEdit()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium">
          <i class="fa-solid fa-xmark"></i> Batal
        </button>
      </div>

      <!-- Mode Lihat Data -->
      <div id="viewMode" class="grid md:grid-cols-2 gap-4">
        <div><label class="text-sm text-gray-500">Nama Lengkap</label><p id="v-nama" class="font-medium text-gray-800"></p></div>
        <div><label class="text-sm text-gray-500">NIK</label><p id="v-nik" class="font-medium text-gray-800"></p></div>
        <div><label class="text-sm text-gray-500">Tempat, Tanggal Lahir</label><p id="v-ttl" class="font-medium text-gray-800"></p></div>
        <div><label class="text-sm text-gray-500">Usia</label><p id="v-usia" class="font-medium text-gray-800"></p></div>
        <div><label class="text-sm text-gray-500">Nama Ayah</label><p id="v-ayah" class="font-medium text-gray-800"></p></div>
        <div><label class="text-sm text-gray-500">Nama Ibu</label><p id="v-ibu" class="font-medium text-gray-800"></p></div>
        <div><label class="text-sm text-gray-500">No. Handphone</label><p id="v-hp" class="font-medium text-gray-800"></p></div>
        <div class="md:col-span-2"><label class="text-sm text-gray-500">Alamat</label><p id="v-alamat" class="font-medium text-gray-800"></p></div>
      </div>

      <!-- Mode Edit Data -->
      <form id="editForm" class="hidden grid md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Panggilan *</label>
          <select id="e-sapaan" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500">
            <option value="Tn.">Tn.</option>
            <option value="Ny.">Ny.</option>
            <option value="Nn.">Nn.</option>
            <option value="An.">An.</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap *</label>
          <input type="text" id="e-nama" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">NIK *</label>
          <input type="text" id="e-nik" maxlength="16" required disabled class="w-full px-3 py-2 border border-gray-300 rounded-lg">
          <p class="text-xs text-gray-500 mt-1">NIK tidak bisa diubah</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">No. Handphone *</label>
          <input type="tel" id="e-hp" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tempat Lahir *</label>
          <input type="text" id="e-tempat" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Lahir *</label>
          <input type="date" id="e-lahir" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Ayah</label>
          <input type="text" id="e-ayah" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Ibu</label>
          <input type="text" id="e-ibu" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Lengkap *</label>
          <textarea id="e-alamat" rows="2" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500"></textarea>
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition">
            <i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan
          </button>
        </div>
      </form>
    </div>

    <!-- Tab 2: Rekam Medis -->
    <div id="content-rekam" class="bg-white p-6 rounded-xl shadow hidden">
      <h2 class="text-xl font-bold text-teal-700 mb-4">Riwayat Rekam Medis</h2>
      <div id="listRekam" class="space-y-3">
        <div class="text-center py-8 text-gray-500">
          <i class="fa-solid fa-folder-open text-4xl mb-2"></i>
          <p>Belum ada riwayat kunjungan</p>
        </div>
      </div>
    </div>

    <!-- Tab 3: Antrian Online -->
    <div id="content-antrian" class="bg-white p-6 rounded-xl shadow hidden">
      <h2 class="text-xl font-bold text-teal-700 mb-4">Ambil Antrian Online</h2>
      <form id="antrianForm" class="max-w-md space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Poli *</label>
          <select id="poli" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500">
            <option value="">-- Pilih Poli --</option>
            <option value="Poli Umum">Poli Umum</option>
            <option value="Poli Gigi">Poli Gigi</option>
            <option value="KIA/KB">KIA/KB</option>
            <option value="Laboratorium">Laboratorium</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition">
          <i class="fa-solid fa-hand-pointer"></i> Ambil Antrian Sekarang
        </button>
        <div id="hasilAntrian" class="hidden text-center p-4 bg-teal-50 rounded-lg border border-teal-200">
          <p class="text-sm text-gray-600">Nomor Antrian Kamu:</p>
          <p id="nomorAntrian" class="text-4xl font-bold text-teal-700 my-2"></p>
          <p class="text-sm text-gray-600">Estimasi dipanggil: <span id="estimasi" class="font-bold"></span></p>
        </div>
      </form>
    </div>
  </main>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytiOmk3hIj-hYcNqNg4dUTUk24ZAg-oJlRbyZI_XK8-f1ocHBCtBjTEucyfSLtCNzDAg/exec';
let user = JSON.parse(localStorage.getItem('userPuskesmas'));
let editMode = false;

// Cek login
if(!user || user.role.toLowerCase()!== 'masyarakat') {
  alert('Silakan login dulu sebagai Masyarakat');
  window.location.href = 'login.html';
}

function hitungUsia(tglLahir) {
  if(!tglLahir) return '-';

  // Convert DD-MM-YYYY ke YYYY-MM-DD biar aman
  let tgl = tglLahir;
  if(tglLahir.includes('-')) {
    const parts = tglLahir.split('-');
    if(parts[0].length == 2) { // Format DD-MM-YYYY
      tgl = `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
  }

  const lahir = new Date(tgl);
  if(isNaN(lahir)) return '0 Hari';

  const hariIni = new Date();

  // Kalo tanggal lahir di masa depan
  if(lahir > hariIni) return '0 Hari';

  let tahun = hariIni.getFullYear() - lahir.getFullYear();
  let bulan = hariIni.getMonth() - lahir.getMonth();
  let hari = hariIni.getDate() - lahir.getDate();

  // Koreksi kalo hari minus
  if (hari < 0) {
    bulan--;
    // Ambil jumlah hari di bulan sebelumnya
    const bulanLalu = new Date(hariIni.getFullYear(), hariIni.getMonth(), 0);
    hari += bulanLalu.getDate();
  }

  // Koreksi kalo bulan minus
  if (bulan < 0) {
    tahun--;
    bulan += 12;
  }

  // Format output
  let hasil = [];

  if(tahun > 0) hasil.push(`${tahun} Tahun`);
  if(bulan > 0) hasil.push(`${bulan} Bulan`);
  if(hari > 0) hasil.push(`${hari} Hari`);

  // Kalo baru lahir hari ini
  if(hasil.length === 0) return '0 Hari';

  return hasil.join(' ');
}
function formatTanggal(tgl) {
  if(!tgl) return '-';
  const date = new Date(tgl);
  return `${String(date.getDate()).padStart(2,'0')}-${String(date.getMonth()+1).padStart(2,'0')}-${date.getFullYear()}`;
}

function loadDataUser() {
  document.getElementById('namaUser').textContent = 'Halo, ' + (user.sapaan || '') + ' ' + user.nama;
  
  // Mode Lihat
  document.getElementById('v-nama').textContent = `${user.sapaan || ''} ${user.nama}`.trim() || '-';
  document.getElementById('v-nik').textContent = user.nik || '-';
  document.getElementById('v-ttl').textContent = user.tempat_lahir && user.tgl_lahir? `${user.tempat_lahir}, ${formatTanggal(user.tgl_lahir)}` : '-';
  document.getElementById('v-usia').textContent = hitungUsia(user.tgl_lahir);
  document.getElementById('v-ayah').textContent = user.nama_ayah || '-';
  document.getElementById('v-ibu').textContent = user.nama_ibu || '-';
  document.getElementById('v-hp').textContent = user.hp || '-';
  document.getElementById('v-alamat').textContent = user.alamat || '-';

  // Mode Edit
  document.getElementById('e-sapaan').value = user.sapaan || 'An.';
  document.getElementById('e-nama').value = user.nama || '';
  document.getElementById('e-nik').value = user.nik || '';
  document.getElementById('e-hp').value = user.hp || '';
  document.getElementById('e-tempat').value = user.tempat_lahir || '';
  document.getElementById('e-lahir').value = user.tgl_lahir || '';
  document.getElementById('e-ayah').value = user.nama_ayah || '';
  document.getElementById('e-ibu').value = user.nama_ibu || '';
  document.getElementById('e-alamat').value = user.alamat || '';
}

function toggleEdit() {
  editMode =!editMode;
  document.getElementById('viewMode').classList.toggle('hidden', editMode);
  document.getElementById('editForm').classList.toggle('hidden',!editMode);
  document.getElementById('btnEdit').classList.toggle('hidden', editMode);
  document.getElementById('btnBatal').classList.toggle('hidden',!editMode);
}

function showTab(tab) {
  ['profil', 'rekam', 'antrian'].forEach(t => {
    document.getElementById('content-' + t).classList.add('hidden');
    document.getElementById('tab-' + t).classList.remove('tab-active');
    document.getElementById('tab-' + t).classList.add('text-gray-600');
  });
  document.getElementById('content-' + tab).classList.remove('hidden');
  document.getElementById('tab-' + tab).classList.add('tab-active');
  document.getElementById('tab-' + tab).classList.remove('text-gray-600');
}

function logout() {
  localStorage.removeItem('userPuskesmas');
  window.location.href = 'index.html';
}

// Simpan edit data
document.getElementById('editForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

  const dataUpdate = {
    action: 'updateProfil',
    nik: user.nik,
    sapaan: document.getElementById('e-sapaan').value,
    nama: document.getElementById('e-nama').value,
    hp: document.getElementById('e-hp').value,
    tempat_lahir: document.getElementById('e-tempat').value,
    tgl_lahir: document.getElementById('e-lahir').value,
    nama_ayah: document.getElementById('e-ayah').value,
    nama_ibu: document.getElementById('e-ibu').value,
    alamat: document.getElementById('e-alamat').value
  };

  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(dataUpdate) });
    const hasil = await res.json();
    if(hasil.status == 'ok') {
      alert('Data berhasil diupdate!');
      // Update localStorage
      user = {...user,...dataUpdate};
      localStorage.setItem('userPuskesmas', JSON.stringify(user));
      loadDataUser();
      toggleEdit();
    } else {
      alert('Gagal update: ' + hasil.message);
    }
  } catch (err) {
    alert('Error koneksi ke server');
  }
  btn.disabled = false;
  btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan';
});

// Ambil antrian
document.getElementById('antrianForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengambil...';

  const data = {
    action: 'daftarAntrian',
    nama: `${user.sapaan} ${user.nama}`, 
    nik: user.nik, 
    hp: user.hp,
    poli: document.getElementById('poli').value
  };

  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
    const hasil = await res.json();
    if(hasil.status == 'ok') {
      document.getElementById('hasilAntrian').classList.remove('hidden');
      document.getElementById('nomorAntrian').textContent = hasil.nomor;
      document.getElementById('estimasi').textContent = hasil.estimasi;
      btn.style.display = 'none';
    } else {
      alert('Gagal ambil antrian: ' + hasil.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> Ambil Antrian Sekarang';
    }
  } catch (err) {
    alert('Error koneksi ke server');
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> Ambil Antrian Sekarang';
  }
});

loadDataUser();
</script>
</body>
</html>
