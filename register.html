<script>
document.getElementById('mobile-btn').addEventListener('click', function() {
  document.getElementById('nav-menu').classList.toggle('show');
});

// Show/hide Kode Admin field
const roleAdmin = document.getElementById('roleAdmin');
const kodeAdminField = document.getElementById('kodeAdminField');
const kodeAdminInput = document.getElementById('kodeAdmin');
const allRoleRadios = document.querySelectorAll('input[name="role"]');

allRoleRadios.forEach(radio => {
  radio.addEventListener('change', function() {
    if (roleAdmin.checked) {
      kodeAdminField.classList.remove('hidden');
      kodeAdminInput.required = true;
    } else {
      kodeAdminField.classList.add('hidden');
      kodeAdminInput.required = false;
      kodeAdminInput.value = '';
    }
  });
});

// ===== INI SCRIPT YANG BENER SAYANG =====
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytiOmk3hIj-hYcNqNg4dUTUk24ZAg-oJlRbyZI_XK8-f1ocHBCtBjTEucyfSLtCNzDAg/exec';

document.getElementById('registerForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const form = e.target;
  const role = document.querySelector('input[name="role"]:checked').value;

  if (role === 'admin' && kodeAdminInput.value!== 'PKM2026') {
    alert('Kode Admin salah! Hubungi Kepala Puskesmas.');
    return;
  }

  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mendaftar...';

  // Trik pake form biar lolos CORS Apps Script
  const iframe = document.createElement('iframe');
  iframe.name = 'hidden_iframe';
  iframe.style.display = 'none';
  document.body.appendChild(iframe);

  const hiddenForm = document.createElement('form');
  hiddenForm.method = 'POST';
  hiddenForm.action = APPS_SCRIPT_URL;
  hiddenForm.target = 'hidden_iframe';

  const fields = {
    action: 'register',
    role: role,
    nik: form.nik.value,
    nama: form.nama.value,
    nohp: form.nohp.value,
    tglLahir: form.tglLahir.value,
    alamat: form.alamat.value,
    password: form.password.value,
    kodeAdmin: kodeAdminInput.value
  };

  for (const key in fields) {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = key;
    input.value = fields[key];
    hiddenForm.appendChild(input);
  }

  document.body.appendChild(hiddenForm);

  // Kalo iframe load berarti udah ke-submit
  iframe.onload = function() {
    alert('Akun berhasil dibuat sebagai ' + role + '! Silakan login.');
    window.location.href = 'login.html';
  };

  hiddenForm.submit();

  // Timeout jaga-jaga kalo ga ada respon
  setTimeout(() => {
    if(btn.disabled) {
      alert('Gagal konek ke server. Coba lagi ya.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Daftar Akun Sekarang';
    }
  }, 8000);
});
</script>
