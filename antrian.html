<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antrian Puskesmas Sehat Bersama</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; cursor: none; } /* HIDE CURSOR BUAT TV */
  .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  .glow-teal {
      box-shadow: 0 0 40px rgba(20, 184, 166, 0.4);
    }
    @keyframes zoomPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  .zoom-animate {
      animation: zoomPulse 2s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-teal-600 via-emerald-600 to-cyan-700 min-h-screen p-4 md:p-8">

  <!-- HEADER -->
  <div class="glass rounded-3xl p-6 mb-6 shadow-2xl">
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 md:w-20 md:h-20 bg-white rounded-2xl flex items-center justify-center shadow-lg">
          <i class="fa-solid fa-hospital text-3xl md:text-4xl text-teal-600"></i>
        </div>
        <div>
          <h1 class="text-2xl md:text-4xl font-black text-white tracking-tight" id="namaPkm">Puskesmas Sehat Bersama</h1>
          <p class="text-teal-100 text-sm md:text-base font-medium">Sistem Antrian Digital Real-time</p>
        </div>
      </div>
      <div class="text-right">
        <div class="text-4xl md:text-6xl font-black text-white tracking-wider" id="jamSekarang">00:00:00</div>
        <div class="text-teal-100 text-sm md:text-base font-medium" id="tanggalSekarang">-</div>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="grid lg:grid-cols-2 gap-6 mb-6">
    <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-12 h-12 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-2xl flex items-center justify-center shadow-lg">
          <i class="fa-solid fa-bell text-white text-xl animate-bounce"></i>
        </div>
        <h2 class="text-xl md:text-2xl font-bold text-white">SEDANG DIPANGGIL</h2>
      </div>
      <div id="cardDipanggil" class="bg-gradient-to-br from-rose-500 to-pink-600 rounded-3xl p-8 md:p-12 text-center shadow-2xl glow-teal">
        <div id="nomorDipanggil" class="text-7xl md:text-9xl font-black text-white mb-4 tracking-tight">---</div>
        <div id="namaDipanggil" class="text-2xl md:text-3xl font-bold text-white mb-2">Menunggu panggilan...</div>
        <div id="poliDipanggil" class="text-lg md:text-xl text-pink-100 font-medium">-</div>
      </div>
    </div>

    <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-12 h-12 bg-gradient-to-br from-blue-400 to-indigo-500 rounded-2xl flex items-center justify-center shadow-lg">
          <i class="fa-solid fa-list-ol text-white text-xl"></i>
        </div>
        <h2 class="text-xl md:text-2xl font-bold text-white">ANTRIAN BERIKUTNYA</h2>
      </div>
      <div id="listAntrian" class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
        <p class="text-center text-teal-100 py-12">Memuat data antrian...</p>
      </div>
    </div>
  </div>

  <!-- FOOTER INFO -->
  <div class="glass rounded-3xl p-4 md:p-6 shadow-2xl">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
      <div>
        <p class="text-teal-100 text-sm mb-1">Total Pasien Hari Ini</p>
        <p class="text-3xl font-black text-white" id="totalHariIni">0</p>
      </div>
      <div>
        <p class="text-teal-100 text-sm mb-1">Rata-rata Waktu Tunggu</p>
        <p class="text-3xl font-black text-white" id="rataMenit">0 menit</p>
      </div>
      <div>
        <p class="text-teal-100 text-sm mb-1">Update Terakhir</p>
        <p class="text-3xl font-black text-white" id="jamUpdate">--:--:--</p>
      </div>
    </div>
  </div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytiOmk3hIj-hYcNqNg4dUTUk24ZAg-oJlRbyZI_XK8-f1ocHBCtBjTEucyfSLtCNzDAg/exec';
let nomorDipanggilTerakhir = '';

// PAKE AUDIO API BIAR LEBIH STABIL DARIPADA SPEECH SYNTHESIS
const tingtongAudio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-doorbell-single-press-333.mp3');
tingtongAudio.volume = 1;

// UPDATE JAM
function updateJam() {
  const now = new Date();
  document.getElementById('jamSekarang').textContent = now.toLocaleTimeString('id-ID', { hour12: false });
  document.getElementById('tanggalSekarang').textContent = now.toLocaleDateString('id-ID', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
}
setInterval(updateJam, 1000);
updateJam();

// LOAD DATA
async function loadData() {
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=getPublic`, {
      method: 'GET',
      redirect: 'follow'
    });
    const hasil = await res.json();

    if(hasil.status == 'ok') {
      document.getElementById('namaPkm').textContent = hasil.namaPkm || 'Puskesmas Sehat Bersama';

      // CEK NOMOR BARU - AUTO BUNYI TANPA KLIK
      if(hasil.dipanggil && hasil.dipanggil.No_Antrian!== nomorDipanggilTerakhir) {
        nomorDipanggilTerakhir = hasil.dipanggil.No_Antrian;
        panggilSuaraAntrian(hasil.dipanggil.No_Antrian, hasil.dipanggil.Poli, hasil.dipanggil.Nama);

        const card = document.getElementById('cardDipanggil');
        card.classList.add('zoom-animate');
        setTimeout(() => card.classList.remove('zoom-animate'), 6000);
      }

      document.getElementById('nomorDipanggil').textContent = hasil.dipanggil? hasil.dipanggil.No_Antrian : '---';
      document.getElementById('namaDipanggil').textContent = hasil.dipanggil? hasil.dipanggil.Nama : 'Menunggu panggilan...';
      document.getElementById('poliDipanggil').textContent = hasil.dipanggil? hasil.dipanggil.Poli : '-';

      const antrian = hasil.antrian || [];
      document.getElementById('listAntrian').innerHTML = antrian.length? antrian.map((a, i) => `
        <div class="glass rounded-2xl p-4 ${i==0? 'border-2 border-yellow-400' : ''} transition">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 bg-white/20 rounded-xl flex items-center justify-center">
                <span class="font-black text-2xl text-white">${i+1}</span>
              </div>
              <div>
                <p class="font-black text-2xl text-white">${a.No_Antrian}</p>
                <p class="text-sm text-teal-100">${a.Nama} - ${a.Poli}</p>
              </div>
            </div>
            <span class="bg-yellow-400 text-yellow-900 px-4 py-2 rounded-xl text-xs font-black">MENUNGGU</span>
          </div>
        </div>
      `).join('') : '<p class="text-center text-teal-100 py-12">Tidak ada antrian menunggu</p>';

      document.getElementById('totalHariIni').textContent = hasil.totalHariIni;
      document.getElementById('rataMenit').textContent = hasil.rataMenit + ' menit';
      document.getElementById('jamUpdate').textContent = new Date().toLocaleTimeString('id-ID');
    }
  } catch (err) {
    console.log('Error:', err);
  }
}

// SUARA PANGGIL - TINGTONG + TTS
function panggilSuaraAntrian(nomorAntrian, namaPoli, namaPasien) {
  // 1. TINGTONG DULU
  tingtongAudio.currentTime = 0;
  tingtongAudio.play().catch(e => console.log('Audio play error:', e));

  // 2. NGOMONG SETELAH 2 DETIK
  setTimeout(() => {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const teks = `Perhatian. Nomor antrian ${nomorAntrian}, atas nama ${namaPasien}, silakan menuju ${namaPoli}`;
    const utterance = new SpeechSynthesisUtterance(teks);
    utterance.lang = 'id-ID';
    utterance.rate = 0.8;
    utterance.volume = 1;
    speechSynthesis.speak(utterance);
    setTimeout(() => speechSynthesis.speak(utterance), 4000);
  }, 2000);
}

// JALANIN LANGSUNG TANPA KLIK
loadData();
setInterval(loadData, 5000);

// RELOAD OTOMATIS TIAP 6 JAM BIAR GA MEMORY LEAK
setTimeout(() => location.reload(), 21600000);
</script>

</body>
</html>
