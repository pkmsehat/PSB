<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Puskesmas Sehat Bersama</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0fdf4; color: #1e293b; }
   .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    header { background: white; box-shadow: 0 1px 3px #0001; position: sticky; top: 0; z-index: 9999; }
   .nav { display: flex; justify-content: space-between; align-items: center; height: 70px; }
   .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; color: #047857; text-decoration: none; }
   .logo img { width: 40px; height: 40px; object-fit: contain; }
   .nav-links { display: flex; gap: 25px; align-items: center; }
   .nav-links a { text-decoration: none; color: #475569; font-weight: 500; transition: 0.2s; }
   .nav-links a:hover { color: #047857; }
   .mobile-btn { display: none; background: none; border: none; font-size: 1.5rem; }
    @media (max-width: 768px) {
     .nav-links { display: none; position: absolute; top: 70px; left: 0; right: 0; background: white; flex-direction: column; padding: 20px; box-shadow: 0 4px 6px #0001; gap: 15px; align-items: start; }
     .nav-links.show { display: flex; }
     .mobile-btn { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="Logo Puskesmas Sehat Bersama">
        <div>PUSKESMAS SEHAT BERSAMA</div>
      </a>
      <nav class="nav-links" id="nav-menu">
        <a href="index.html">Home</a>
        <a href="register.html" style="background:#86efac;color:#065f46;padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:600;">Daftar</a>
      </nav>
      <button class="mobile-btn" id="mobile-btn">☰</button>
    </div>
  </header>

  <main class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
      <div class="text-center mb-6">
        <img src="logo.png" alt="Logo Puskesmas Sehat Bersama" class="w-16 h-16 mx-auto mb-3 object-contain">
        <h1 class="text-2xl font-bold text-teal-700">Login Akun</h1>
        <p class="text-gray-600 text-sm mt-1">Masuk untuk ambil antrian online</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Login Sebagai *</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="relative">
              <input type="radio" name="role" value="masyarakat" class="peer sr-only" checked>
              <div class="p-3 border-2 rounded-lg cursor-pointer text-center peer-checked:border-teal-600 peer-checked:bg-teal-50 peer-checked:text-teal-700">
                <i class="fa-solid fa-user text-lg mb-1"></i>
                <p class="text-sm font-medium">Masyarakat</p>
              </div>
            </label>
            <label class="relative">
              <input type="radio" name="role" value="admin" class="peer sr-only">
              <div class="p-3 border-2 rounded-lg cursor-pointer text-center peer-checked:border-amber-600 peer-checked:bg-amber-50 peer-checked:text-amber-700">
                <i class="fa-solid fa-user-shield text-lg mb-1"></i>
                <p class="text-sm font-medium">Admin</p>
              </div>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">NIK *</label>
          <input type="text" name="nik" maxlength="16" placeholder="16 digit NIK" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password *</label>
          <input type="password" name="password" placeholder="Masukkan password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
        </div>

        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Login Sekarang
        </button>

        <div class="text-center text-sm text-gray-600">
          Belum punya akun? <a href="register.html" class="text-teal-600 font-medium hover:underline">Daftar di sini</a>
        </div>
        <div class="text-center">
          <a href="index.html" class="text-sm text-gray-500 hover:text-teal-600"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
        </div>
      </form>
    </div>
  </main>

<script>
document.getElementById('mobile-btn').addEventListener('click', function() {
  document.getElementById('nav-menu').classList.toggle('show');
});

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytiOmk3hIj-hYcNqNg4dUTUk24ZAg-oJlRbyZI_XK8-f1ocHBCtBjTEucyfSLtCNzDAg/exec';

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Login...';

  const data = {
    action: 'login',
    role: document.querySelector('input[name="role"]:checked').value,
    nik: form.nik.value,
    password: form.password.value
  };

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(data)
    });
    const hasil = await res.json();

    if(hasil.status == 'ok') {
      // Simpen data user ke browser
      localStorage.setItem('userPuskesmas', JSON.stringify(hasil.user));
      alert('Login berhasil! Halo ' + hasil.user.nama);
      
      // Kalo admin, ke dashboard admin. Kalo masyarakat, ke ambil antrian
      if(hasil.user.role == 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'dashboard-masyarakat.html';
      }
    } else {
      alert('Login gagal: ' + hasil.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login Sekarang';
    }
  } catch (err) {
    alert('Error koneksi ke server');
    console.error(err);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login Sekarang';
  }
});
</script>
</body>
</html>
